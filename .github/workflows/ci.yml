name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
      - name: Unit tests (no model needed)
        run: ./gradlew test installDist
      - name: Every quote in the bundled brain still occurs in its source
        working-directory: demo
        run: ../brain verify
